schema: spec-driven

context: |
  XMPP client built with Expo SDK 57, React Native 0.86, React 19, Expo Router 57
  and strict TypeScript. Android/iOS use CNG; native customizations live in
  modules/ and plugins/. Linux uses the shared web frontend in Tauri. OMEMO 2
  is a pure TypeScript core; legacy OMEMO is Android-only. Follow AGENTS.md.
  New work uses `openspec/changes/` and must pass `make check`.

