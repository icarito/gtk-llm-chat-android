name: Release

# Construye y publica gtk-llm-chat-android SIN EAS Build.
#
# El proyecto usa Continuous Native Generation: android/ e ios/ no estan
# versionados y se generan en CI con `npx expo prebuild`.
#
# Disparadores:
#   - push de tags v*   -> APK/AAB firmados + IPA (si hay secretos iOS)
#   - workflow_dispatch -> lo mismo, sobre la rama elegida
#
# Android firma release con las propiedades inyectadas de Gradle
# (-Pandroid.injected.signing.*). iOS archiva con xcodebuild, exporta con
# ExportOptions.plist (app-store, manual) y sube el IPA con `xcrun altool`
# usando una App Store Connect API key.
#
# Requisitos de version: app.config.js debe leer process.env.BUILD_NUMBER
# (versionCode de Android y CFBundleVersion de iOS). Ver docs/ci.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Monotonico y unico por corrida. app.config.js debe mapearlo a
  # android.versionCode y ios.buildNumber (CFBundleVersion).
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # Debe escribirse ANTES de prebuild: app.config.js agrega
      # android.googleServicesFile solo si el archivo existe.
      - name: Write google-services.json (opcional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
            echo "google-services.json escrito ($(wc -c < google-services.json) bytes)"
          else
            echo "::notice::GOOGLE_SERVICES_JSON_B64 no configurado: se omite google-services.json."
          fi

      - name: Prebuild Android
        run: npx expo prebuild -p android --no-install

      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASS:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Faltan ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS: no se puede firmar release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
          echo "Keystore de release escrita ($(wc -c < android/app/release.keystore) bytes)."

      - name: Build release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASS"

      - name: Collect APK and AAB
        env:
          VERSION_SLUG: ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}
        run: |
          set -euo pipefail
          SLUG="${VERSION_SLUG#v}"
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$APK" && test -n "$AAB"
          cp "$APK" "dist/gtk-llm-chat-android-${SLUG}.apk"
          cp "$AAB" "dist/gtk-llm-chat-android-${SLUG}.aab"
          ls -lh dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtk-llm-chat-android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Attach APK/AAB to GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          fail_on_unmatched_files: true

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUNDLE_ID: org.fuentelibre.exit-x-chat
    steps:
      # `secrets` no se puede usar en un `if` de job/paso. Se resuelve aca y el
      # resto de los pasos queda gateado por los outputs.
      - name: Check iOS signing availability
        id: gate
        env:
          IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -eu
          if [ -z "${IOS_CERT_P12_B64:-}" ] || [ -z "${IOS_CERT_PASSWORD:-}" ] || [ -z "${IOS_PROVISION_B64:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secretos de firma iOS (IOS_CERT_P12_B64 / IOS_CERT_PASSWORD / IOS_PROVISION_B64). Se omite el build iOS; el resto del release sigue."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ] && [ -n "${ASC_API_KEY_P8:-}" ]; then
            echo "testflight=true" >> "$GITHUB_OUTPUT"
          else
            echo "testflight=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan APP_STORE_CONNECT_KEY_ID / ISSUER_ID / API_KEY_P8: se exporta el IPA pero no se sube a TestFlight."
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Node 20
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Prebuild iOS
        if: steps.gate.outputs.skip != 'true'
        run: npx expo prebuild -p ios --no-install

      - name: Pod install
        if: steps.gate.outputs.skip != 'true'
        working-directory: ios
        run: pod install

      - name: Import signing certificate into temporary keychain
        if: steps.gate.outputs.skip != 'true'
        env:
          IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          printf '%s' "$IOS_CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning

      - name: Install provisioning profile and read metadata
        if: steps.gate.outputs.skip != 'true'
        id: profile
        env:
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
        run: |
          set -euo pipefail
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$IOS_PROVISION_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          test -n "$TEAM_ID" && test -n "$PROFILE_NAME" && test -n "$PROFILE_UUID"

          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES/$PROFILE_UUID.mobileprovision"
          {
            echo "team_id=$TEAM_ID"
            echo "profile_name=$PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Perfil instalado: $PROFILE_NAME ($PROFILE_UUID), team $TEAM_ID"

      - name: Write ExportOptions.plist
        if: steps.gate.outputs.skip != 'true'
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib

          options = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"],
              },
              "uploadSymbols": True,
              "stripSwiftSymbols": True,
          }
          with open("ExportOptions.plist", "wb") as fh:
              plistlib.dump(options, fh)
          print("ExportOptions.plist escrito")
          PY
          cat ExportOptions.plist

      - name: Archive and export IPA
        if: steps.gate.outputs.skip != 'true'
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
        run: |
          set -euo pipefail
          # El nombre del workspace/scheme lo genera prebuild a partir de
          # app.json; no se hardcodea.
          WS=$(ls -d ios/*.xcworkspace | head -n 1)
          test -n "$WS" || { echo "::error::No se encontro ios/*.xcworkspace"; exit 1; }
          WS_NAME=$(basename "$WS" .xcworkspace)
          # Prebuild nombra el scheme de la app igual que el workspace. NO usar
          # schemes[0] de `xcodebuild -list`: viene ordenado y el primero es un
          # pod (EXApplication), que archiva una librería sin método de export.
          SCHEME="$WS_NAME"
          echo "workspace=$WS scheme=$SCHEME"

          ARCHIVE="$RUNNER_TEMP/build/${WS_NAME}.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/build/export"
          rm -rf "$ARCHIVE" "$EXPORT_DIR"

          xcodebuild archive \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$(node -p "require('./app.json').expo.version")" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates

          IPA=$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" || { echo "::error::exportArchive no produjo IPA"; exit 1; }
          mkdir -p dist
          SLUG="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || SLUG="$BUILD_NUMBER"
          cp "$IPA" "dist/gtk-llm-chat-${SLUG}.ipa"
          ls -lh dist

      - name: Upload iOS artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gtk-llm-chat-ios-${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload IPA to TestFlight
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.testflight == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          IPA=$(find dist -maxdepth 1 -name '*.ipa' -print -quit)
          test -s "$IPA" || { echo "::error::No hay IPA para TestFlight"; exit 1; }
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Attach IPA to GitHub Release
        if: steps.gate.outputs.skip != 'true' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          fail_on_unmatched_files: true
